[project]
name = "micachy"
# Kept in step with manifest.json's version, and asserted in tests/test_manifest.py.
# The bar widget shells out to this package's `micachy-ctl`, so the two ship as
# one thing — a plugin newer than the backend it calls is the support case
# nobody can debug from a screenshot.
version = "0.6.1"
description = "Omarchy-native LED control for CPU cooler fans, GPU, and the cooler's display"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Diego Huyke" }]
requires-python = ">=3.11"

# The backend is stdlib-only: raw hidraw writes and I2C_SMBUS ioctls through
# ctypes, so there are no runtime dependencies to pin and no lockfile.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[project.urls]
Homepage = "https://github.com/villenull/micachy"

[project.scripts]
micachy-ctl = "micachy.ctl:main"
micachy-setup = "micachy.setup:main"
micachy-displayd = "micachy.displayd:main"
micachy-lightd = "micachy.lightd:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
